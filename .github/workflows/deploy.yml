name: Deploy

# OPS-03: deploy manual, só pela main, no environment producao, um por vez e sem cancelar o que
# está em andamento. Este é o único arquivo do repositório que roda `wrangler deploy` (OPS-04).
# Nada aqui roda sozinho: o primeiro deploy é decisão do dono do produto.
# O Neon tem só duas branches permanentes, `main` (produção, a que os secrets NEON_URL_* deste
# environment apontam) e `dev`. O deploy não cria branch: o ponto de volta antes de migrar é o
# dump cifrado com age, guardado como artefato.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Instalar pg_dump 18 e age
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Build do web
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm build:web

      - name: Conferir que o cache do Hyperdrive está desligado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # OPS-13: falha fechado se a API não disser caching.disabled = true (ou com o id placeholder).
        run: pnpm --filter @es/scripts cache-hyperdrive

      - name: Validar a URL do Neon da migração
        env:
          NEON_URL_MIGRACAO: ${{ secrets.NEON_URL_MIGRACAO }}
        # validarUrlNeon: host *.neon.tech, conexão direta (sem -pooler) e sslmode exigindo TLS.
        run: node backend/scripts/src/neon/validar-url.ts NEON_URL_MIGRACAO

      - name: Validar a URL do Neon do backup
        env:
          NEON_URL_BACKUP: ${{ secrets.NEON_URL_BACKUP }}
        # validarUrlNeon: host *.neon.tech, conexão direta (sem -pooler) e sslmode exigindo TLS.
        run: node backend/scripts/src/neon/validar-url.ts NEON_URL_BACKUP

      - name: Dump cifrado antes da migração
        env:
          NEON_URL_BACKUP: ${{ secrets.NEON_URL_BACKUP }}
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
        # Pela evolucao_backup_ro, como o backup diário (OPS-01): a role de migração não precisa de
        # BYPASSRLS. --enable-row-security: as tabelas com RLS são lidas pelas policies da
        # evolucao_backup_ro; sem a opção o pg_dump falha nelas.
        # pg_dump 18 pelo caminho absoluto: o PATH do runner tem o 16, que recusa o servidor 18 do Neon.
        # shell: bash liga o pipefail; sem ele a falha do pg_dump some atrás do `| age` e o passo
        # fica verde com um arquivo vazio.
        shell: bash
        run: |
          /usr/lib/postgresql/18/bin/pg_dump -Fc --enable-row-security "$NEON_URL_BACKUP" | age -r "$AGE_PUBLIC_KEY" -o dump-pre-deploy.dump.age
      - name: Guardar o dump cifrado
        uses: actions/upload-artifact@v7
        with:
          name: dump-pre-deploy-${{ github.run_id }}
          path: dump-pre-deploy.dump.age
          retention-days: 30

      - name: Migração com a role owner
        env:
          NEON_URL_MIGRACAO: ${{ secrets.NEON_URL_MIGRACAO }}
        # --alvo producao: a trava de host aceita o Neon só com alvo explícito e CI=true.
        run: pnpm migrar --alvo producao

      - name: Deploy do Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          URL_PUBLICA: ${{ vars.URL_PUBLICA }}
        run: |
          pnpm --filter @es/api exec wrangler deploy --config ../../wrangler.jsonc \
            --var "URL_PUBLICA:$URL_PUBLICA" \
            --var "SENTRY_RELEASE:${{ github.sha }}"
